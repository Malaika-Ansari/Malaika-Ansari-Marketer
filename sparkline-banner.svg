.container {
position: relative;
width: 1000px;
height: 320px;
background: radial-gradient(circle at 85% 20%, #1a1030 0%, #080914 70%);
border-radius: 12px;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
box-sizing: border-box;
border: 1px solid rgba(255, 255, 255, 0.1);
}
.bg-grid {
position: absolute;
inset: 0;
background-image:
linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
background-size: 32px 32px;
}
.glow {
position: absolute;
right: 90px;
top: 30px;
width: 250px;
height: 250px;
background: radial-gradient(circle, rgba(255, 67, 101, 0.25) 0%, rgba(0, 210, 255, 0.15) 50%, transparent 70%);
filter: blur(40px);
animation: pulse 4s infinite alternate;
}
@keyframes pulse {
0% { transform: scale(0.9); opacity: 0.5; }
100% { transform: scale(1.15); opacity: 1; }
}
.chart-path {
stroke-dasharray: 900;
stroke-dashoffset: 900;
animation: drawChart 5s ease-in-out infinite;
}
@keyframes drawChart {
0% { stroke-dashoffset: 900; }
50% { stroke-dashoffset: 0; }
90% { stroke-dashoffset: 0; opacity: 1; }
100% { stroke-dashoffset: 0; opacity: 0.3; }
}
.content {
position: absolute;
top: 36px;
left: 45px;
z-index: 10;
}
.brand {
font-size: 36px;
font-weight: 800;
color: #ffffff;
margin: 0;
}
.brand span {
background: linear-gradient(90deg, #ff4365, #ff9e00);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.tagline {
font-size: 13px;
font-weight: 600;
letter-spacing: 2px;
text-transform: uppercase;
color: #00d2ff;
margin-top: 5px;
}
.subtext {
color: #94a3b8;
font-size: 14px;
margin-top: 10px;
max-width: 460px;
line-height: 1.4;
}
.skills-container {
margin-top: 24px;
display: flex;
align-items: center;
gap: 12px;
}
.badge-slider {
position: relative;
height: 36px;
width: 380px;
overflow: hidden;
}
.badge {
position: absolute;
inset: 0;
display: inline-flex;
align-items: center;
gap: 8px;
padding: 6px 14px;
border-radius: 20px;
font-size: 13px;
font-weight: 600;
opacity: 0;
transform: translateY(16px);
animation: rotateSkill 12s infinite;
}
.badge-1 { background: rgba(0, 210, 255, 0.12); border: 1px solid #00d2ff; color: #00d2ff; animation-delay: 0s; }
.badge-2 { background: rgba(255, 67, 101, 0.12); border: 1px solid #ff4365; color: #ff4365; animation-delay: 3s; }
.badge-3 { background: rgba(255, 158, 0, 0.12); border: 1px solid #ff9e00; color: #ff9e00; animation-delay: 6s; }
.badge-4 { background: rgba(168, 85, 247, 0.12); border: 1px solid #a855f7; color: #c084fc; animation-delay: 9s; }
@keyframes rotateSkill {
0% { opacity: 0; transform: translateY(14px); }
5% { opacity: 1; transform: translateY(0); }
22% { opacity: 1; transform: translateY(0); }
27% { opacity: 0; transform: translateY(-14px); }
100% { opacity: 0; transform: translateY(-14px); }
}
.floating-icon {
position: absolute;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
box-shadow: 0 4px 16px rgba(0,0,0,0.4);
animation: float 3s ease-in-out infinite alternate;
}
@keyframes float {
0% { transform: translateY(0px); }
100% { transform: translateY(-10px); }
}
.footer {
position: absolute;
bottom: 18px;
left: 45px;
display: flex;
gap: 20px;
font-size: 12px;
color: #64748b;
}
.footer span { color: #cbd5e1; }